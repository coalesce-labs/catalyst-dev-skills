name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Tools the shell suites need
        run: |
          missing=""
          for tool in sqlite3 jq zsh; do command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"; done
          if [ -n "$missing" ]; then sudo apt-get update -q && sudo apt-get install -y -q $missing; fi

      - name: Vendored copies match their sources
        run: node scripts/vendor.mjs --check

      - name: Development pack and Claude plugin versions agree
        run: npm run version:check

      - name: Tests (bun suites, then every tests/*.test.sh)
        run: bash scripts/run-tests.sh

      - name: Skills install to one declared scope (test:guards)
        run: bun run test:guards

      - name: Skill names do not collide with the other Coalesce Labs packs
        run: |
          git clone -q --depth 1 https://github.com/coalesce-labs/catalyst-cloud-skills "$RUNNER_TEMP/catalyst-cloud-skills"
          git clone -q --depth 1 https://github.com/coalesce-labs/catalyst-pm-skills "$RUNNER_TEMP/catalyst-pm-skills"
          node scripts/check-name-collisions.mjs "$RUNNER_TEMP/catalyst-cloud-skills" "$RUNNER_TEMP/catalyst-pm-skills"

      - name: Development pack is on the shared release line
        run: node scripts/check-release-line.mjs "$RUNNER_TEMP/catalyst-cloud-skills"

      - name: Install smoke (skills@1.5.26 into a scratch HOME, three harnesses)
        run: bash scripts/install-smoke.sh

      - name: Install scope (documented command, repository stays empty)
        run: bash scripts/install-scope-smoke.sh

  # CTC-9951: a working document belongs in the run's artifact directory, never on a branch of this
  # public repository. A repository whose default branch tracks its own thoughts/ keeps them.
  no-thoughts-documents:
    name: no thoughts documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refuse thoughts/ documents the default branch does not track
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch -q --no-tags --depth=1 origin "refs/heads/${BASE}"
          if [ -n "$(git ls-tree --name-only FETCH_HEAD -- thoughts)" ]; then
            echo "${BASE} tracks thoughts/, so this repository keeps its own."
            exit 0
          fi
          paths="$(git ls-tree -r --name-only HEAD -- thoughts)"
          if [ -z "${paths}" ]; then
            echo "No thoughts/ documents."
            exit 0
          fi
          echo "${paths}" | while read -r path; do
            echo "::error file=${path}::${path} is a thoughts/ document, and ${BASE} does not track thoughts/. Remove it from this branch."
          done
          exit 1

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: gitleaks (history and working tree)
        run: |
          gitleaks git --redact --no-banner .
          gitleaks dir --redact --no-banner .

      - name: Internal-pattern scan
        run: |
          bash scripts/scan-internal.sh --self-test
          bash scripts/scan-internal.sh
